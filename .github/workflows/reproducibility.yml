name: Public reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out public release
        uses: actions/checkout@v6

      - name: Set up frozen Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Verify CPU-only test environment
        run: |
          python -c "import torch; assert torch.__version__.split('+')[0] == '2.8.0'; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Run tests
        run: bash scripts/reproduce_all.sh
