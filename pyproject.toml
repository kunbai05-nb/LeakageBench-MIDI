[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakagebench-midi"
version = "1.1.1"
description = "Measure and mitigate same-work family leakage in symbolic music generation"
authors = [{name = "Kun Bai"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "mido>=1.3,<2", "torch>=2.3,<3"]

[project.urls]
Repository = "https://github.com/kunbai05-nb/LeakageBench-MIDI"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["leakagebench_midi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
